<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>順番と日割りのテスト</title>
  <meta name="theme-color" content="#1E6B66">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <header class="bar">
    <a class="icon-btn" href="../" aria-label="アプリに戻る"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="bar-title"><h1>順番と日割りのテスト</h1><span class="sub">見本データで、決め方を比べるためのページです</span></div>
  </header>

  <main class="page stack-lg" id="top">
    <section class="card stack">
      <label for="sc">シナリオ</label>
      <select id="sc"></select>
      <details id="guide" open>
        <summary>このシナリオで確かめること・やってみること</summary>
        <div class="stack" id="guide-body"></div>
      </details>
    </section>

    <section class="stack">
      <h2>決め方</h2>
      <div class="segs" role="radiogroup" aria-label="決め方" id="methods"></div>
      <p class="hint" id="method-desc"></p>
      <div class="row-inline wrap">
        <div class="segs small" role="radiogroup" aria-label="移動手段" id="modes"></div>
        <button class="btn small" type="button" id="reset">最初からやり直す</button>
      </div>
    </section>
  </main>

  <div class="trip-bar" id="trip-bar">
    <button class="btn small" type="button" id="trip-toggle" aria-pressed="false">旅行中モード：オフ</button>
    <div class="trip-ctrls" id="trip-ctrls" hidden>
      <label for="today">今日</label><select id="today"></select>
      <label for="now">今の時刻</label><select id="now"></select>
      <button class="btn small" type="button" id="gps">本物の現在地</button>
    </div>
  </div>
  <div class="map-wrap"><div id="map" class="map lab-map" role="region" aria-label="地図"></div><div class="map-hint" id="map-hint" hidden></div></div>

  <main class="page stack-lg">
    <section class="notice stack" id="next" hidden></section>
    <div id="days" class="stack-lg"></div>
    <section class="stack" id="extra"></section>

    <section class="card stack" id="feedback">
      <h2>このシナリオの感想</h2>
      <fieldset class="stack"><legend>一番しっくりきた決め方</legend>
        <div class="grid2" id="fb-best"></div>
      </fieldset>
      <label for="fb-memo">感じたこと（ひとことでOK）</label>
      <textarea id="fb-memo" rows="3" placeholder="例：Aは勝手に動きすぎて落ち着かない。予約のある日は自分で決めたい"></textarea>
      <button class="btn primary" type="button" id="fb-copy">全シナリオの感想をコピー</button>
      <pre class="fb-out copy-target" id="fb-out" hidden></pre>
      <p class="hint">コピーした内容を、そのままClaudeとのチャットに貼り付けてください。</p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="lab.js"></script>
</body>
</html>

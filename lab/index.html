<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>神戸旅行テスト</title>
  <meta name="theme-color" content="#1E6B66">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <header class="bar">
    <a class="icon-btn" href="../" aria-label="アプリに戻る"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="bar-title"><h1>神戸旅行テスト</h1><span class="sub">10/31(土)〜11/3(火・祝)</span></div>
  </header>

  <main class="page stack-lg">
    <section class="card stack task" aria-labelledby="task-h">
      <label for="sc">シナリオ</label>
      <select id="sc"></select>
      <div class="stack" id="task" aria-live="polite"></div>
    </section>

    <section class="card stack" aria-labelledby="reg-h">
      <h2 id="reg-h">場所を登録</h2>
      <span class="label">候補から選ぶ</span>
      <div class="cand-chips" id="cands"></div>
      <label class="label" for="q">または名前・住所で探す</label>
      <div class="row-inline"><input id="q" placeholder="例：南京町、神戸ポートタワー"><button class="btn" type="button" id="search">探す</button></div>
      <div id="results" aria-live="polite"></div>
      <form class="stack reg-form" id="form" hidden></form>
    </section>

    <div class="row-inline wrap">
      <span class="label">移動手段</span>
      <div class="segs small" role="radiogroup" aria-label="移動手段" id="modes"></div>
    </div>
  </main>

  <div class="trip-bar">
    <button class="btn small" type="button" id="trip-toggle" aria-pressed="false">旅行中モード：オフ</button>
    <div class="trip-ctrls" id="trip-ctrls" hidden>
      <label for="today">今日</label><select id="today"></select>
      <label for="now">今の時刻</label><select id="now"></select>
      <button class="btn small" type="button" id="gps">本物の現在地</button>
    </div>
  </div>
  <div class="map-wrap"><div id="map" class="map lab-map" role="region" aria-label="地図"></div><div class="map-hint" id="map-hint" hidden></div></div>

  <main class="page stack-lg">
    <section class="notice stack" id="next" hidden></section>
    <div id="days" class="stack-lg"></div>
    <section class="stack" id="extra"></section>

    <section class="card stack" id="feedback">
      <h2>感想をClaudeに送る</h2>
      <label for="fb-memo">このシナリオで感じたこと（ひとことでOK・なくてもOK）</label>
      <textarea id="fb-memo" rows="3" placeholder="例：宿は登録の最初に決めたい"></textarea>
      <button class="btn primary" type="button" id="fb-copy">全シナリオの答えと感想をコピー</button>
      <pre class="fb-out copy-target" id="fb-out" hidden></pre>
      <p class="hint">コピーした内容を、そのままチャットに貼り付けてください。</p>
    </section>
    <p class="hint">位置はおおよそです。営業時間は調べた時点の情報なので、実際の旅行前には公式サイトで確認してください。</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="lab.js"></script>
</body>
</html>
